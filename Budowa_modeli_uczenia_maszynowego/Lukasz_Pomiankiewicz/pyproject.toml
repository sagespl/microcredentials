[project]
name = "customer-intelligence-ml-platform"
version = "0.1.0"
description = "End-to-end Machine Learning platform for customer segmentation and churn prediction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "mlflow>=3.14.0",
    "numpy>=2.5.1",
    "pandas>=2.3.3",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap==0.52.0",
    "uvicorn>=0.51.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
